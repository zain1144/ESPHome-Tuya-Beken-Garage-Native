substitutions:
  device_name: "cb3s-garage-door"
  friendly_name: "Garage Door"

esphome:
  name: "${device_name}"
  friendly_name: "${friendly_name}"
  comment: "BK7231N/CB3S garage opener - Modbus RTU reverse engineered from stock dump"
  # Keep the motor bus silent while Wi-Fi is starting. The controller poller is
  # resumed by wifi.on_connect below.
  on_boot:
    priority: 500
    then:
      - component.suspend: garage_motor
  # A software reboot can otherwise happen while the attached opener is in the
  # middle of a Modbus transaction. Always leave its UART driver idle first.
  on_shutdown:
    priority: 700
    then:
      - component.suspend: garage_motor
      - lambda: id(motor_modbus).clear_tx_queue_for_address(0x01);

bk72xx:
  board: cb3s

logger:
  # UART1 is dedicated to the garage motor. Do not send logs over it.
  baud_rate: 0
  level: DEBUG
  logs:
    modbus: DEBUG
    modbus_controller: DEBUG

# Retain the last reset reason and expose runtime diagnostics so intermittent
# restarts can be diagnosed later from Home Assistant history.
debug:
  update_interval: 30s

api:
  # Do not create a reboot loop if Home Assistant is temporarily unavailable
  # after an OTA update.
  reboot_timeout: 0s

ota:
  - platform: esphome
    # Keep only Wi-Fi/OTA activity running while flash is being written. This is
    # especially important when the module is powered by and connected to the
    # garage opener, where a warm reboot previously left it unreachable.
    on_begin:
      then:
        - globals.set:
            id: ota_active
            value: "true"
        - component.suspend: garage_motor
        - lambda: id(motor_modbus).clear_tx_queue_for_address(0x01);
        - logger.log: "OTA guard active: motor bus stopped and queue cleared"
    on_abort:
      then:
        - globals.set:
            id: ota_active
            value: "false"
        - if:
            condition: wifi.connected
            then:
              - delay: 5s
              - component.resume:
                  id: garage_motor
                  update_interval: 2s
    on_error:
      then:
        - globals.set:
            id: ota_active
            value: "false"
        - if:
            condition: wifi.connected
            then:
              - delay: 5s
              - component.resume:
                  id: garage_motor
                  update_interval: 2s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Stay available through the fallback AP instead of repeatedly rebooting
  # while diagnosing an OTA-startup problem.
  reboot_timeout: 0s
  # Open recovery AP: if the configured Wi-Fi cannot be reached, look for this
  # SSID to confirm that the CB3S has booted without reflashing it.
  ap:
    ssid: "${friendly_name} Fallback"
  on_connect:
    then:
      - if:
          condition:
            lambda: return !id(ota_active);
          then:
            - delay: 5s
            - component.resume:
                id: garage_motor
                update_interval: 2s
  on_disconnect:
    then:
      - component.suspend: garage_motor

captive_portal:

web_server:
  port: 80
  version: 3

# Original board status LED recovered from the stock application.
status_led:
  pin:
    number: P26
    inverted: true

uart:
  id: motor_uart
  tx_pin: P11
  rx_pin: P10
  baud_rate: 9600
  data_bits: 8
  parity: ODD
  stop_bits: 1

modbus:
  id: motor_modbus
  uart_id: motor_uart
  # P7 does not leave the PCB through the USB-shaped connector. The stock
  # firmware nevertheless drives it HIGH around UART TX and LOW afterwards,
  # so it is most likely the enable for the board's internal TX driver.
  flow_control_pin: P7
  # Stock firmware can wait about 240 ms for the first response byte.
  send_wait_time: 300ms
  turnaround_time: 50ms

modbus_controller:
  - id: garage_motor
    address: 0x01
    modbus_id: motor_modbus
    # Door state/position/light refresh every 2s; static settings use skip_updates.
    update_interval: 2s
    # Do not flood the queue if the motor is absent; probe again every 4 seconds.
    max_cmd_retries: 0
    offline_skip_updates: 1

globals:
  - id: ota_active
    type: bool
    restore_value: false
    initial_value: "false"

  - id: remote_delete_armed
    type: bool
    restore_value: false
    initial_value: "false"

script:
  - id: write_motor_register
    mode: queued
    parameters:
      register_address: int
      register_value: int
    then:
      - if:
          condition:
            lambda: return !id(ota_active);
          then:
            - lambda: |-
                auto *controller = id(garage_motor);
                controller->queue_command(
                  esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
                    controller,
                    static_cast<uint16_t>(register_address),
                    static_cast<uint16_t>(register_value)
                  )
                );
          else:
            - logger.log:
                level: WARN
                format: "Motor command ignored while OTA is active"

sensor:
  - platform: uptime
    name: "Device Uptime"
    update_interval: 30s
    entity_category: diagnostic

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 30s
    entity_category: diagnostic

  # This is the BK7231N die temperature, not the surrounding air temperature.
  - platform: internal_temperature
    name: "Internal Temperature"
    update_interval: 60s
    entity_category: diagnostic

  # Runtime health indicators used to distinguish memory exhaustion from a
  # blocked main loop when the hardware watchdog resets the module.
  - platform: debug
    free:
      name: "Free Heap"
      entity_category: diagnostic
    min_free:
      name: "Minimum Free Heap"
      entity_category: diagnostic
    loop_time:
      name: "Loop Time"
      entity_category: diagnostic

  # 0=stationary, 1=opening, 2=closing.
  - platform: modbus_controller
    modbus_controller_id: garage_motor
    id: motor_motion_raw
    register_type: holding
    address: 0x1000
    value_type: U_WORD
    force_new_range: true
    accuracy_decimals: 0
    internal: true
    on_value:
      then:
        - lambda: |-
            if (x == 1.0f) {
              id(garage_door).current_operation = COVER_OPERATION_OPENING;
              id(garage_door).publish_state();
            } else if (x == 2.0f) {
              id(garage_door).current_operation = COVER_OPERATION_CLOSING;
              id(garage_door).publish_state();
            } else {
              // Do not publish the idle state yet. Register 0x1001 is read
              // immediately after 0x1000 and still holds the authoritative
              // final position. Publishing here would briefly reuse the old
              // position and report OPEN just before CLOSED.
              id(garage_door).current_operation = COVER_OPERATION_IDLE;
            }

  # Motor raw travel already matches Home Assistant: 0=closed, 100=open.
  - platform: modbus_controller
    modbus_controller_id: garage_motor
    id: garage_position
    name: "Opening Position"
    register_type: holding
    address: 0x1001
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "%"
    icon: "mdi:garage-open-variant"
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      then:
        - lambda: id(garage_door).publish_state();

number:
  # Tuya DP2 schema is exactly 0..600 with step 10. The live capture confirmed
  # that this setting writes the automatic-closing delay in seconds.
  - platform: modbus_controller
    modbus_controller_id: garage_motor
    name: "Automatic Closing Delay"
    register_type: holding
    address: 0xA100
    value_type: U_WORD
    force_new_range: true
    skip_updates: 14
    min_value: 0
    max_value: 600
    step: 10
    unit_of_measurement: "s"
    mode: box
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: garage_motor
    name: "Opening Force"
    register_type: holding
    address: 0x4006
    value_type: U_WORD
    force_new_range: true
    skip_updates: 14
    min_value: 1
    max_value: 9
    step: 1
    mode: slider
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: garage_motor
    name: "Closing Force"
    register_type: holding
    address: 0x4007
    value_type: U_WORD
    force_new_range: true
    skip_updates: 14
    min_value: 1
    max_value: 9
    step: 1
    mode: slider
    entity_category: config

  # Tuya labels this separately from the seconds-based delay at 0xA100.
  - platform: modbus_controller
    modbus_controller_id: garage_motor
    name: "Closing Delay Setting (Raw)"
    register_type: holding
    address: 0x4008
    value_type: U_WORD
    force_new_range: true
    skip_updates: 14
    min_value: 0
    max_value: 9
    step: 1
    mode: slider
    entity_category: config

  # Confirmed Tuya range is 0..99; its time unit still needs a motor test.
  - platform: modbus_controller
    modbus_controller_id: garage_motor
    name: "Light-Off Delay (Raw)"
    register_type: holding
    address: 0xA101
    value_type: U_WORD
    force_new_range: true
    skip_updates: 14
    min_value: 0
    max_value: 99
    step: 10
    mode: slider
    entity_category: config

binary_sensor:
  # Original active-low local button. Its physical meaning is not assumed, so
  # it is exposed read-only and does not move the door by itself.
  - platform: gpio
    id: opener_button
    name: "Module Button"
    pin:
      number: P14
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    entity_category: diagnostic

  - platform: modbus_controller
    modbus_controller_id: garage_motor
    id: motor_light_feedback
    register_type: holding
    address: 0x1100
    bitmask: 0x0001
    force_new_range: true
    internal: true
    on_state:
      then:
        - lambda: id(motor_light).publish_state(x);

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"
      entity_category: diagnostic

  # Tuya DP113 is a local information string, not a Modbus register.
  - platform: template
    name: "Original Module Information"
    icon: "mdi:information-outline"
    entity_category: diagnostic
    update_interval: 1h
    lambda: return {"WIFI Module, CB3S, SW:1.0.7"};

  - platform: template
    name: "Door State"
    icon: "mdi:garage"
    update_interval: 500ms
    lambda: |-
      if (!id(motor_motion_raw).has_state() || !id(garage_position).has_state()) {
        return {};
      }
      if (id(motor_motion_raw).state == 1.0f) return {"Opening"};
      if (id(motor_motion_raw).state == 2.0f) return {"Closing"};
      if (id(garage_position).state >= 99.5f) return {"Open"};
      if (id(garage_position).state <= 0.5f) return {"Closed"};
      return {"Stopped"};

cover:
  - platform: template
    id: garage_door
    name: "Garage Door"
    device_class: garage
    has_position: false
    # HA otherwise disables OPEN as soon as a partially-open stopped door is
    # reported as OPEN. Keep OPEN and CLOSE available at all intermediate
    # positions; the separate Opening Position sensor remains authoritative.
    assumed_state: true
    lambda: |-
      if (!id(garage_position).has_state()) return {};
      if (id(garage_position).state <= 0.5f) return COVER_CLOSED;
      return COVER_OPEN;
    open_action:
      - script.execute:
          id: write_motor_register
          register_address: 0x2000
          register_value: 1
    stop_action:
      - script.execute:
          id: write_motor_register
          register_address: 0x2000
          register_value: 0
    close_action:
      - script.execute:
          id: write_motor_register
          register_address: 0x2000
          register_value: 2

switch:
  - platform: modbus_controller
    modbus_controller_id: garage_motor
    name: "Photoelectric Safety Sensor"
    register_type: holding
    address: 0x4009
    bitmask: 0x0001
    force_new_range: true
    skip_updates: 14
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: garage_motor
    name: "Three-Button Remote Control"
    register_type: holding
    address: 0x400B
    bitmask: 0x0001
    force_new_range: true
    skip_updates: 14
    entity_category: config

  - platform: modbus_controller
    modbus_controller_id: garage_motor
    name: "Vacation Mode"
    register_type: holding
    address: 0x4010
    bitmask: 0x0001
    force_new_range: true
    skip_updates: 14
    entity_category: config

  - platform: template
    id: motor_light
    name: "Motor Light"
    icon: "mdi:lightbulb"
    lambda: |-
      if (!id(motor_light_feedback).has_state()) return {};
      return id(motor_light_feedback).state;
    turn_on_action:
      - script.execute:
          id: write_motor_register
          register_address: 0x2004
          register_value: 1
    turn_off_action:
      - script.execute:
          id: write_motor_register
          register_address: 0x2004
          register_value: 0

  # Two-step protection for the destructive remote-delete command.
  - platform: template
    id: arm_remote_delete
    name: "Arm Remote Delete (15s)"
    icon: "mdi:shield-alert"
    entity_category: config
    disabled_by_default: true
    optimistic: true
    turn_on_action:
      - globals.set:
          id: remote_delete_armed
          value: "true"
      - delay: 15s
      - globals.set:
          id: remote_delete_armed
          value: "false"
      - lambda: id(arm_remote_delete).publish_state(false);
    turn_off_action:
      - globals.set:
          id: remote_delete_armed
          value: "false"

button:
  - platform: template
    name: "Open"
    icon: "mdi:arrow-up-bold"
    on_press:
      - script.execute:
          id: write_motor_register
          register_address: 0x2000
          register_value: 1

  - platform: template
    name: "Stop"
    icon: "mdi:stop"
    on_press:
      - script.execute:
          id: write_motor_register
          register_address: 0x2000
          register_value: 0

  - platform: template
    name: "Close"
    icon: "mdi:arrow-down-bold"
    on_press:
      - script.execute:
          id: write_motor_register
          register_address: 0x2000
          register_value: 2

  - platform: template
    name: "Learn Remote Control"
    icon: "mdi:remote"
    entity_category: config
    on_press:
      - script.execute:
          id: write_motor_register
          register_address: 0x2005
          register_value: 1

  - platform: template
    name: "Delete All Remote Controls"
    icon: "mdi:remote-off"
    entity_category: config
    disabled_by_default: true
    on_press:
      - if:
          condition:
            lambda: return id(remote_delete_armed);
          then:
            - script.execute:
                id: write_motor_register
                register_address: 0x2005
                register_value: 2
            - globals.set:
                id: remote_delete_armed
                value: "false"
            - lambda: id(arm_remote_delete).publish_state(false);
          else:
            - logger.log:
                level: WARN
                format: "Remote command 2 blocked: arm it first"

  - platform: template
    name: "EXPERIMENTAL - Motor Command 5 (Unknown)"
    icon: "mdi:help-rhombus"
    entity_category: config
    disabled_by_default: true
    on_press:
      - script.execute:
          id: write_motor_register
          register_address: 0x2000
          register_value: 5
